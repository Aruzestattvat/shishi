<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾事</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--side:#f4f4f4;--surface:#f6f6f6;--hover:#eaeaea;--selected:#e3e3e3;--line:#e5e5e5;--ink:#242424;--muted:#777;--faint:#a2a2a2;--accent:#087dff;--danger:#b13d32;--warning:#fcf0ed;--shadow:0 18px 70px #0002}

*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--ink);font:13px -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}button,input,select{font:inherit;color:inherit}button{cursor:pointer;background:transparent;border:0;padding:7px 11px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}button:hover{background:var(--hover)}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}input,select{border:1px solid var(--line);border-radius:7px;background:var(--bg);padding:7px 9px;min-width:0}input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px;flex:none;margin:0;cursor:pointer}svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;flex:none}.icon{width:31px;height:31px;padding:6px;color:var(--muted)}.primary{background:var(--ink);color:var(--bg)}.primary:hover{background:var(--ink);opacity:.85}.secondary{background:var(--surface);border:1px solid var(--line)}.muted{color:var(--muted)}.small{font-size:12px}.row{display:flex;gap:9px;align-items:center}.between{justify-content:space-between}h1,h2,h3,p{margin:0}h1{font-size:15px;font-weight:600}h2{font-size:19px;font-weight:600;letter-spacing:-.4px}h3{font-size:13px;font-weight:600}.app{display:grid;grid-template-columns:248px minmax(0,1fr);height:100%}.sidebar{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding:0 12px}.brand{height:58px;display:flex;align-items:center;gap:9px;padding:0 10px;font-size:17px;font-weight:650;flex:none}.brand svg{width:21px;height:21px}.navigation{display:grid;gap:3px;margin-bottom:24px}.nav{justify-content:flex-start;text-align:left;height:36px;padding:0 11px;width:100%;color:var(--muted)}.nav.active{background:var(--selected);color:var(--ink)}.nav .count{margin-left:auto;font-size:11px;font-variant-numeric:tabular-nums}.sidebar-heading{font-size:11px;font-weight:550;color:var(--muted);padding:0 11px 9px}.searchbox{display:flex;align-items:center;gap:7px;padding:0 9px;background:var(--hover);border-radius:7px;margin:0 4px 10px}.searchbox svg{width:14px;height:14px;color:var(--muted)}.searchbox input{width:100%;background:transparent;border:0;padding:7px 0;font-size:12px;outline:none}.chats{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:0 2px}.chat{display:flex;gap:9px;align-items:center;min-height:40px;padding:6px 7px;border-radius:7px;cursor:pointer;font-size:12px}.chat:hover{background:var(--hover)}.chat.enabled{color:var(--ink)}.chat:not(.enabled){color:var(--muted)}.chat input{margin-left:auto;opacity:.35}.chat:hover input,.chat input:checked,.chat input:focus-visible{opacity:1}.chat-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pinned-block{background:var(--hover);border-radius:8px;margin-bottom:7px;padding:2px}.pinned-block .chat:hover{background:var(--selected)}.avatar{width:25px;height:25px;border-radius:7px;overflow:hidden;position:relative;display:inline-grid;place-items:center;flex:none;background:var(--selected);color:var(--muted);font-size:11px}.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.avatar.mini{width:18px;height:18px;border-radius:5px;font-size:9px}.sidebar-bottom{padding:10px 0 12px;flex:none;border-top:1px solid var(--line);margin-top:10px}.sidebar-bottom>button{width:100%;justify-content:flex-start}.save-wrap{padding:8px 4px}.save-wrap button{width:100%}[hidden]{display:none!important}.main{display:flex;flex-direction:column;min-width:0;min-height:0}.toolbar{height:58px;padding:0 25px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex:none}.toolbar-right{display:flex;gap:8px;align-items:center}.connection{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}.dot{width:5px;height:5px;border-radius:50%;background:#58a779;display:inline-block}.connection.idle .dot{background:var(--faint)}.content{overflow:auto;flex:1;min-height:0;padding:24px 36px}.list{max-width:800px;margin:0 auto}.empty{min-height:330px;height:55vh;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:15px}.empty svg{width:32px;height:32px;stroke-width:1.15;color:var(--faint)}.empty p{font-size:13px}.item{padding:18px 0;border-bottom:1px solid var(--line)}.item-top{display:flex;align-items:flex-start;gap:12px}.item-icon{color:var(--faint);padding-top:2px}.item-toggle{padding:0;width:23px;height:23px;margin-top:0;color:var(--faint);background:transparent;border-radius:50%}.item-toggle:hover{background:transparent;color:var(--ink)}.item-toggle svg{width:20px;height:20px}.item.toggleable h3{cursor:pointer}.item.toggleable:hover .item-toggle{color:var(--ink)}.item-body{flex:1;min-width:0}.item h3{font-size:14px;font-weight:500;line-height:1.6;word-break:break-word}.item-meta{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px;margin-top:7px;flex-wrap:wrap}.tag{font-size:10px;color:var(--muted);padding:2px 6px;background:var(--surface);border-radius:4px;white-space:nowrap}.item-actions{display:flex;gap:4px;align-items:center;margin-top:12px}.item-actions button{padding:5px 9px;font-size:12px}.item details{margin:10px 0 0;font-size:12px;color:var(--muted)}summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:4px}summary::-webkit-details-marker{display:none}summary svg{width:12px;height:12px}details[open]>summary svg{transform:rotate(90deg)}.evidence{padding:12px 0 1px}.evidence>p{margin-bottom:12px;color:var(--muted)}blockquote{margin:0 0 12px;padding:0 0 0 11px;border-left:2px solid var(--line);white-space:pre-wrap;word-break:break-word;color:var(--ink)}blockquote time{display:block;font-size:10px;color:var(--muted);margin-bottom:4px}.banner{background:var(--warning);color:var(--danger);padding:10px 12px;border-radius:8px;font-size:12px;display:flex;gap:12px;align-items:center;justify-content:space-between;margin:0 auto 18px;max-width:800px}.banner button{flex:none;font-size:12px}.notice{color:var(--muted);text-align:center;padding:15px;font-size:12px}dialog{color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:0;width:min(510px,90vw);max-height:85vh;overflow:auto}dialog::backdrop{background:#0005}.dialog-head{display:flex;justify-content:space-between;align-items:center;padding:19px 23px 14px;position:sticky;top:0;background:var(--bg);z-index:1}.dialog-body{padding:0 24px 24px}.settings-group{padding:18px 0;border-bottom:1px solid var(--line)}.settings-group:first-child{padding-top:7px}.settings-group:last-child{border:0;padding-bottom:0}.settings-group h3{margin-bottom:13px}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:12px 0}.setting-row:last-child{margin-bottom:0}.setting-row>label{flex:none}.setting-row input[type=number]{width:122px}.setting-row input[type=date]{width:145px}.setting-row select{max-width:285px}.settings-note{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.7}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:17px}.field>label{font-size:12px;color:var(--muted)}.field input{width:100%}.dialog-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:12px;box-shadow:var(--shadow);z-index:10;max-width:80vw}.edit-help{font-size:11px;color:var(--muted);margin-top:7px}a{color:var(--accent)}@media(max-width:760px){.app{grid-template-columns:205px minmax(0,1fr)}.content{padding:18px 22px}.toolbar{padding:0 20px}.connection span:last-child{display:none}}@media(prefers-reduced-motion:no-preference){button{transition:background .12s ease}.toast{animation:appear .12s ease}@keyframes appear{from{opacity:0}to{opacity:1}}}
</style></head>
<body><div class="app">
<aside class="sidebar" aria-label="侧栏"><div class="brand"><span data-icon="checklist"></span>拾事</div>
<nav class="navigation" aria-label="事项分类"><button class="nav active" data-tab="review" aria-current="page"><span data-icon="inbox"></span>待查看<span class="count" id="reviewcount"></span></button><button class="nav" data-tab="active"><span data-icon="circle"></span>待办<span class="count" id="activecount"></span></button><button class="nav" data-tab="done"><span data-icon="done"></span>已处理<span class="count" id="donecount"></span></button></nav>
<div class="sidebar-heading">聊天</div><div class="searchbox"><span data-icon="search"></span><input id="search" aria-label="搜索聊天" placeholder="搜索聊天" autocomplete="off"></div><div id="chats" class="chats" aria-label="选择聊天"></div>
<div id="savewrap" class="save-wrap" hidden><button id="save" class="primary">保存选择</button></div><div class="sidebar-bottom"><button id="settingsButton"><span data-icon="settings"></span>设置</button></div></aside>
<main class="main"><header class="toolbar"><h1 id="pageTitle">待查看</h1><div class="toolbar-right"><div id="connection" class="connection"><i class="dot"></i><span id="live">连接中</span></div><button id="pause" class="icon" aria-label="暂停分析" title="暂停分析"></button></div></header><div class="content"><div id="errors" role="status"></div><div id="items" class="list"></div></div></main></div>
<dialog id="settings" aria-labelledby="settingsTitle"><div class="dialog-head"><h2 id="settingsTitle">设置</h2><button class="icon" data-close="settings" aria-label="关闭设置"><span data-icon="close"></span></button></div><div class="dialog-body">
<div class="settings-group"><div class="row between"><h3>提醒事项</h3><span id="syncstatus" class="small muted"></span></div><div id="nativehelp" class="settings-note" hidden></div><div class="setting-row"><select id="calendar" aria-label="提醒清单"><option value="">选择清单</option></select><button id="choose" class="secondary">使用</button><button id="authorize" class="primary">授权</button></div></div>
<div class="settings-group"><h3>消息范围</h3><div class="setting-row"><label for="newonly">仅记录新消息</label><input type="checkbox" id="newonly" role="switch"></div><div class="setting-row" id="sinceRow"><label for="since">起始日期</label><div class="row"><input id="since" type="date"><button id="setsince" class="secondary">应用</button></div></div><div class="setting-row" id="lookbackRow"><label for="lookback">历史范围</label><select id="lookback"><option value="7">最近 7 天</option><option value="30">最近 30 天</option><option value="90">最近 3 个月</option><option value="365">最近一年</option><option value="0">全部历史</option></select></div></div>
<div class="settings-group"><h3>用量</h3><div class="setting-row"><span class="muted">今日使用</span><span id="usage"></span></div><div class="setting-row"><label for="budget">每日 token 上限</label><div class="row"><input id="budget" type="number" min="5000" max="1000000" step="5000"><button id="setbudget" class="secondary">保存</button></div></div></div>
<div class="settings-group"><details><summary>数据与隐私</summary><p class="settings-note">仅分析选中的聊天。候选消息及必要上下文发送至 DeepSeek。语音会用本机 Qwen3-ASR 模型转写（可能有识别误差，语音来源的事项仍建议核对）；图片和附件正文暂不处理。</p><p class="settings-note">事项写入所选提醒清单；跨设备同步由该清单所属账户管理。</p></details></div></div></dialog>
<dialog id="editor" aria-labelledby="editorTitle"><div class="dialog-head"><h2 id="editorTitle">确认事项</h2><button class="icon" data-close="editor" aria-label="关闭确认窗口"><span data-icon="close"></span></button></div><form id="editForm" class="dialog-body"><div class="field"><label for="editTitle">事项</label><input id="editTitle" required minlength="2" maxlength="120"></div><div class="field"><label for="editDate">日期</label><input id="editDate" type="date"></div><div class="field"><label for="editTime">时间（可选）</label><input id="editTime" type="time"><p class="edit-help">不设截止日期时留空。</p></div><p class="small muted" id="editAction"></p><div class="dialog-actions"><button type="button" data-close="editor">取消</button><button type="submit" id="approve" class="primary">加入提醒</button></div></form></dialog>
<div id="toast" class="toast" role="status" hidden></div>
<script>
'use strict';
const token='__CSRF__',$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const paths={checklist:'<path d="m3 6 2 2 3-4M11 6h10M3 13l2 2 3-4M11 13h10M11 20h10"/>',inbox:'<path d="m4 4-2 10v6h20v-6L20 4Z"/><path d="M2 14h6l2 3h4l2-3h6"/>',circle:'<circle cx="12" cy="12" r="9"/>',done:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',settings:'<path d="M4 6h16M4 12h16M4 18h16"/><path d="M8 4v4M16 10v4M10 16v4"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',pause:'<path d="M8 5v14M16 5v14"/>',play:'<path d="m8 5 11 7-11 7Z"/>',chevron:'<path d="m9 5 7 7-7 7"/>'};
const icon=name=>`<svg viewBox="0 0 24 24" aria-hidden="true">${paths[name]||paths.circle}</svg>`;
document.querySelectorAll('[data-icon]').forEach(e=>e.outerHTML=icon(e.dataset.icon));
let state=null,selection=new Set(),dirty=false,tab='review',editing=null,lastChatsSig='',lastItemsSig='',lastCalendar='',refreshing=false,pollTimer,toastTimer,pollGeneration=0;const optimistic=new Map();
const titles={review:'待查看',active:'待办',done:'已处理'},labels={review:'待查看',ready:'待同步',queued:'同步中',synced:'已同步',completed:'已完成',cancelled:'已取消',dismissed:'已忽略',sync_error:'同步失败'};
function toast(text){clearTimeout(toastTimer);$('toast').textContent=text;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,3000)}
async function post(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Shishi-Token':token},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'操作失败');return d}
async function act(path,body){try{await post(path,body);await refresh()}catch(e){toast(e.message)}}
function applyOptimistic(){if(!state)return;for(const [id,target] of [...optimistic]){const item=state.items.find(x=>x.id===id);if(!item){optimistic.delete(id);continue}if(item.status===target){optimistic.delete(id);continue}if(['sync_error','review','dismissed','cancelled'].includes(item.status)){optimistic.delete(id);continue}item.status=target}}
async function toggleItem(id,action){if(!state||optimistic.has(id))return;const item=state.items.find(x=>x.id===id);if(!item)return;const target=action==='complete'?'completed':'synced';optimistic.set(id,target);item.status=target;render();try{await post('/api/item',{id,action});await refresh()}catch(e){optimistic.delete(id);await refresh();toast(e.message);return}setTimeout(()=>{if(optimistic.has(id)){optimistic.delete(id);refresh()}},15000)}
function avatar(s,mini=false){const name=String(s?.name||'?');return `<span class="avatar${mini?' mini':''}"><span>${esc(Array.from(name.trim())[0]||'?')}</span>${s?.avatar?`<img src="/api/avatar?sid=${encodeURIComponent(s.id)}" loading="lazy" decoding="async" alt="" onerror="this.remove()">`:''}</span>`}
function chatRow(s){return `<label class="chat${selection.has(s.id)?' enabled':''}">${avatar(s)}<span class="chat-name" title="${esc(s.name)}">${esc(s.name)}</span><input type="checkbox" value="${esc(s.id)}" aria-label="分析 ${esc(s.name)}" ${selection.has(s.id)?'checked':''}></label>`}
function chats(){if(!state)return;const q=$('search').value.trim().toLowerCase();const rows=state.sessions.filter(s=>s.kind!==3&&s.name.toLowerCase().includes(q)).sort((a,b)=>Number(!!b.pinned)-Number(!!a.pinned)||((b.pinned?b.sort_ts:0)||b.last_ts||0)-((a.pinned?a.sort_ts:0)||a.last_ts||0));$('savewrap').hidden=!dirty;
const sig=JSON.stringify([rows.map(s=>[s.id,s.name,s.avatar,s.pinned]),[...selection].sort(),q]);if(sig===lastChatsSig)return;lastChatsSig=sig;const pinned=rows.filter(s=>s.pinned),rest=rows.filter(s=>!s.pinned),scroll=$('chats').scrollTop,focused=document.activeElement?.type==='checkbox'?document.activeElement.value:null;
$('chats').innerHTML=(pinned.length?`<div class="pinned-block">${pinned.map(chatRow).join('')}</div>`:'')+rest.map(chatRow).join('')+(!rows.length?'<p class="notice">没有匹配的聊天</p>':'');$('chats').scrollTop=scroll;if(focused)[...$('chats').querySelectorAll('input')].find(e=>e.value===focused)?.focus({preventScroll:true});}
function dueLabel(value){if(!value)return '无日期';if(/^\d{4}-\d{2}-\d{2}$/.test(value)){const [y,m,d]=value.split('-');return `${+m}月${+d}日${y!==String(new Date().getFullYear())?' · '+y:''}`}const date=new Date(value);if(Number.isNaN(date.getTime()))return '时间待核对';return new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).format(date)}
function visibleItems(){const chosen=new Set(state.sessions.filter(s=>s.selected).map(s=>s.id));return state.items.filter(x=>chosen.has(x.sid)&&!(state.cutoff&&['review','sync_error'].includes(x.status)&&(x.evidence||[]).every(e=>(e.ts||0)<state.cutoff)))}
function itemHTML(x,sessions){const chat=sessions.get(x.sid)||{id:x.sid,name:'聊天'},review=['review','sync_error'].includes(x.status),toggle=['synced','completed'].includes(x.status),toggleLabel=x.status==='completed'?'标记为未完成':'标记为已完成',toggleIcon=toggle?`<button class="item-icon item-toggle" data-toggle="${esc(x.id)}" aria-label="${toggleLabel}" title="${toggleLabel}">${icon(x.status==='completed'?'done':'circle')}</button>`:`<span class="item-icon">${icon(x.status==='completed'?'done':'circle')}</span>`;return `<article class="item${toggle?' toggleable':''}" data-id="${esc(x.id)}" data-status="${esc(x.status)}"><div class="item-top">${toggleIcon}<div class="item-body"><div class="row between"><h3>${esc(x.title)}</h3>${tab==='active'||tab==='done'?`<span class="tag">${esc(labels[x.status])}</span>`:''}</div><div class="item-meta">${avatar(chat,true)}<span>${esc(chat.name)}</span><span>·</span><span>${esc(dueLabel(x.due))}</span></div><details><summary>${icon('chevron')}聊天依据</summary><div class="evidence">${review&&x.review_reasons?.length?`<p>${esc(x.review_reasons.join('；'))}</p>`:''}${x.reason?`<p>${esc(x.reason)}</p>`:''}${(x.evidence||[]).map(e=>`<blockquote><time>${esc(new Date(e.ts).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'}))} · ${e.direction==='2'?'我':'对方'}${e.transcribed?' · 语音转写':''}</time>${esc(e.quote)}</blockquote>`).join('')}</div></details>${review?`<div class="item-actions"><button class="secondary" data-edit="${esc(x.id)}">${['cancel','complete','reschedule'].includes(x.action)?'确认变更':'确认加入'}</button><button data-dismiss="${esc(x.id)}">忽略</button></div>`:''}</div></div></article>`}
function render(){const s=state,n=s.native;const status=s.paused?'已暂停':s.state.error?'需要处理':s.state.connected?'已连接':'连接中';$('live').textContent=status;$('connection').classList.toggle('idle',s.paused||!s.state.connected);$('connection').title=n.authorized&&n.calendar_id?`提醒事项：${n.source} / ${n.calendar_name}`:'提醒事项尚未连接';$('pause').innerHTML=icon(s.paused?'play':'pause');$('pause').title=s.paused?'继续分析':'暂停分析';$('pause').setAttribute('aria-label',$('pause').title);
const errors=[s.state.error,s.state.bridge_error,...(s.bridge_errors||[]).map(x=>x.error),...s.sessions.filter(x=>x.selected&&x.error).map(x=>x.name+'：'+x.error)].filter(Boolean);$('errors').innerHTML=errors.length?`<div class="banner"><span>${esc(errors[0])}</span><button ${s.state.error?'data-retry':'data-settings'}>${s.state.error?'重试':'查看设置'}</button></div>`:!n.authorized||!n.calendar_id?'<div class="banner"><span>连接提醒事项后即可同步待办</span><button data-settings>连接</button></div>':'';
const items=visibleItems(),groups={review:items.filter(x=>['review','sync_error'].includes(x.status)),active:items.filter(x=>['ready','queued','synced'].includes(x.status)),done:items.filter(x=>['completed','cancelled','dismissed'].includes(x.status))};for(const key of Object.keys(groups))$(key+'count').textContent=groups[key].length||'';
$('pageTitle').textContent=titles[tab];document.querySelectorAll('[data-tab]').forEach(b=>{const current=b.dataset.tab===tab;b.classList.toggle('active',current);if(current)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
const rows=groups[tab],sessions=new Map(s.sessions.map(x=>[x.id,x]));const sig=JSON.stringify([tab,rows,s.sessions.filter(x=>rows.some(r=>r.sid===x.id)).map(x=>[x.id,x.name,x.avatar]),s.sessions.some(x=>x.selected)]);if(sig!==lastItemsSig){lastItemsSig=sig;const open=new Set([...$('items').querySelectorAll('article')].filter(e=>e.querySelector('details[open]')).map(e=>e.dataset.id));$('items').innerHTML=rows.length?rows.map(x=>itemHTML(x,sessions)).join(''):`<div class="empty">${icon(tab==='review'?'inbox':tab==='active'?'checklist':'done')}<p>${!s.sessions.some(x=>x.selected)?'选择聊天，开始记录':tab==='review'?'暂无待查看事项':tab==='active'?'暂无待办':'暂无已处理事项'}</p></div>`;[...$('items').querySelectorAll('article')].forEach((e,i)=>{e.dataset.id=rows[i].id;if(open.has(rows[i].id))e.querySelector('details').open=true})}
renderSettings();}
function renderSettings(){if(!state)return;const s=state,n=s.native;$('usage').textContent=s.usage.tokens.toLocaleString()+' token';if(document.activeElement!==$('budget'))$('budget').value=s.budget;if(document.activeElement!==$('since'))$('since').value=s.since_date||'';if(document.activeElement!==$('lookback'))$('lookback').value=String(s.lookback);$('newonly').checked=!!s.new_only;$('sinceRow').hidden=!s.new_only;$('lookbackRow').hidden=!!s.new_only;
$('syncstatus').textContent=!n.online?'应用未连接':n.authorized?(n.calendar_id?(n.source||'已连接'):'未选择清单'):'未授权';$('authorize').hidden=!!n.authorized;$('choose').hidden=!n.authorized;$('calendar').hidden=!n.authorized;$('nativehelp').hidden=n.online;$('nativehelp').textContent='请打开「拾事」应用以连接提醒事项。';const sig=JSON.stringify([n.calendars,n.calendar_id]);if(sig!==lastCalendar){lastCalendar=sig;$('calendar').innerHTML='<option value="">选择清单</option>'+(n.calendars||[]).map(c=>`<option value="${esc(c.id)}" ${c.id===n.calendar_id?'selected':''}>${esc(c.source)} · ${esc(c.title)}</option>`).join('')}}
async function refresh(){if(refreshing)return;refreshing=true;try{const r=await fetch('/api/state');if(!r.ok)throw Error();state=await r.json();applyOptimistic();if(!dirty)selection=new Set(state.sessions.filter(s=>s.selected).map(s=>s.id));chats();render()}catch(e){$('live').textContent='连接中';$('connection').classList.add('idle')}finally{refreshing=false}}
function openSettings(){renderSettings();if(!$('settings').open)$('settings').showModal()}
$('search').oninput=chats;$('chats').onchange=e=>{if(e.target.type!=='checkbox')return;e.target.checked?selection.add(e.target.value):selection.delete(e.target.value);const saved=state.sessions.filter(s=>s.selected).map(s=>s.id);dirty=selection.size!==saved.length||saved.some(id=>!selection.has(id));chats()};
$('save').onclick=async()=>{const b=$('save');b.disabled=true;try{await post('/api/select',{ids:[...selection]});dirty=false;await refresh()}catch(e){toast(e.message)}finally{b.disabled=false}};
$('settingsButton').onclick=openSettings;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).close());document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()}}));
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;if(state)render()});$('errors').onclick=e=>{if(e.target.closest('[data-retry]'))act('/api/settings',{retry:true});if(e.target.closest('[data-settings]'))openSettings()};
$('pause').onclick=()=>state&&act('/api/settings',{paused:!state.paused});$('newonly').onchange=()=>act('/api/settings',{new_only:$('newonly').checked});$('setsince').onclick=()=>act('/api/settings',{new_only:true,since_date:$('since').value});$('lookback').onchange=()=>act('/api/settings',{lookback_days:Number($('lookback').value)});$('setbudget').onclick=()=>act('/api/settings',{budget:Number($('budget').value),retry:true});$('authorize').onclick=()=>act('/api/native',{op:'authorize'});$('choose').onclick=()=>act('/api/native',{op:'choose',calendar_id:$('calendar').value});
$('items').onclick=e=>{const toggle=e.target.closest('[data-toggle]'),article=e.target.closest('article.toggleable');if(toggle||(article&&!e.target.closest('details,summary,button,a,blockquote,time'))){const id=toggle?toggle.dataset.toggle:article.dataset.id,status=article?.dataset.status||'';if(id)toggleItem(id,status==='completed'?'reopen':'complete');return}
const edit=e.target.closest('[data-edit]'),dismiss=e.target.closest('[data-dismiss]');if(dismiss)act('/api/item',{id:dismiss.dataset.dismiss,action:'dismiss'});if(!edit)return;editing=state.items.find(x=>x.id===edit.dataset.edit);$('editTitle').value=editing.title;$('editDate').value='';$('editTime').value='';if(editing.due){if(/^\d{4}-\d{2}-\d{2}$/.test(editing.due))$('editDate').value=editing.due;else{const dt=new Date(editing.due);if(!Number.isNaN(dt.getTime())){const parts=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(dt),v=Object.fromEntries(parts.map(p=>[p.type,p.value]));$('editDate').value=`${v.year}-${v.month}-${v.day}`;$('editTime').value=`${v.hour}:${v.minute}`}}}const action={cancel:'取消原提醒',complete:'标记原提醒已完成',reschedule:'更新原提醒时间'}[editing.action];$('editorTitle').textContent=action?'确认变更':'确认事项';$('editAction').textContent=action||'';$('approve').textContent=action?'确认变更':'加入提醒';$('editor').showModal()};
$('editForm').onsubmit=async e=>{e.preventDefault();const date=$('editDate').value,time=$('editTime').value;if(time&&!date){toast('请先选择日期');return}const b=$('approve');b.disabled=true;try{await post('/api/item',{id:editing.id,action:'approve',title:$('editTitle').value,due:date?(time?`${date}T${time}:00+08:00`:date):null});$('editor').close();await refresh()}catch(err){toast(err.message)}finally{b.disabled=false}};
async function poll(generation=++pollGeneration){await refresh();if(generation!==pollGeneration)return;pollTimer=setTimeout(()=>poll(generation),document.hidden?20000:4000)}window.__shishiOpenTab=function(t){if(t==='review'||t==='active'||t==='done'){tab=t;if(state)render()}};document.addEventListener('visibilitychange',()=>{clearTimeout(pollTimer);poll()});document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key===','){e.preventDefault();openSettings()}});poll();
